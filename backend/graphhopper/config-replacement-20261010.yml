graphhopper:
  datareader.file: ""
  graph.location: graph-cache-expanded-20261010

  profiles:
    - name: car
      custom_model_files: [saferoute-car.json]

  profiles_ch:
    - profile: car

  graph.encoded_values: car_access, car_average_speed, road_access
  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1
  routing.snap_preventions_default: tunnel,bridge,ferry
  routing.timeout_ms: 12000
  routing.non_ch.max_waypoint_distance: 1000000
  import.osm.ignored_highways: footway,construction,cycleway,path,steps
  graph.dataaccess.default_type: RAM_STORE
  datareader.preferred_language: en

server:
  application_connectors:
    - type: http
      port: 8997
      bind_host: 127.0.0.1
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8996
      bind_host: 127.0.0.1

logging:
  appenders:
    - type: file
      time_zone: UTC
      current_log_filename: logs/replacement-20261010.log
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
      archive: true
      archived_log_filename_pattern: ./logs/replacement-20261010-%d.log.gz
      archived_file_count: 30
      never_block: true
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
